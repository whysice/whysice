[build]
  command = "npm run build"
  publish = ".next"
  # If your repo root contains a whysice/ subfolder, uncomment the next line:
  # base = "whysice"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
